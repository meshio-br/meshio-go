name: release

# Em Go, publicar = criar a tag vX.Y.Z; o proxy de módulos busca a versão direto do repositório.
# Este fluxo apenas cria a release no GitHub com as notas do CHANGELOG.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test -count=1 ./...
      - name: notas da versão
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { inside = index($0, "[" v "]") > 0; next }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Versão ${GITHUB_REF_NAME}" > release-notes.md
      - name: criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
